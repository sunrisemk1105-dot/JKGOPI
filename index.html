<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>JKGO派車助手</title>

<style>

.card-header{
    background:#ff4d5a;
    color:white;
    padding:10px 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:100px;
    font-weight:bold;
}

.logo{
     width: 210px;
     height: 70px;
    object-fit:fill;
}

body{
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.topbar{
    background:#ff8800;
    color:white;
    padding:18px 25px;
    font-size:26px;
    font-weight:bold;
    border-radius:10px 10px 0 0;
}

.form-area{
    background:white;
    padding:25px;
    border-radius:0 0 10px 10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.btn{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    color:white;
}

.generate{
    background:#111827;
}

.download{
    background:#2563eb;
}

.card{
    margin-top:30px;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
}

.card-header{
    background:#FF8C00;
    color:white;
    padding:16px;
    font-size:20px;
    font-weight:bold;
}

.dispatch-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    padding:25px;
}

.item{
    margin-bottom:15px;
}

.item-title{
    font-size:14px;
    color:#666;
    margin-bottom:5px;
}

.item-box{
    border:1px solid #ccc;
    padding:6px;
    background:#fafafa;
    border-radius:5px;
    min-height:15px;
}

.footer{
    padding:12px;
    text-align:center;
    color:#999;
}

.sign-area{
    display:flex;
    justify-content:space-around;
    margin:10px 30px 20px;
}

.sign-box{
    width:50%;
    text-align:center;
}

.sign-title{
    margin-bottom:200px;
    font-size:25px;
    color:#333;
}

.sign-line{
    border-bottom:2px solid #333;
    width:100%;
}

@media(max-width:768px){

.grid,
.dispatch-grid{
    grid-template-columns:1fr;
}

.landscape{
    width:1200px;
    background:white;
}

}

</style>
</head>

<body>

<div class="container">

<div class="topbar">
✈️ JKGO派車助手
</div>

<div class="form-area">

<div class="grid">

<div>

<div class="input-group">
<label>接送日期</label>
<input type="text" id="date">
</div>

<div class="input-group">
<label>接送類型</label>
<input type="text" id="type">
</div>

<div class="input-group">
<label>貴賓姓名</label>
<input type="text" id="name">
</div>

<div class="input-group">
<label>乘車人數</label>
<input type="text" id="people">
</div>

<div class="input-group">
<label>上車地點</label>
<input type="text" id="pickup">
</div>

<div class="input-group">
<label>中途加點</label>
<input type="text" id="add">
</div>

</div>

<div>

<div class="input-group">
<label>接送時間</label>
<input type="text" id="time">
</div>

<div class="input-group">
<label>航班代號</label>
<input type="text" id="flight">
</div>

<div class="input-group">
<label>連絡電話</label>
<input type="text" id="phone">
</div>

<div class="input-group">
<label>行李件數</label>
<input type="text" id="bags">
</div>

<div class="input-group">
<label>下車地點</label>
<input type="text" id="dropoff">
</div>

<div class="input-group">
<label>重要備註</label>
<input type="text" id="remark">
</div>

</div>

</div>

<button class="btn generate" onclick="generateCard()">
🚗 產生派車單
</button>

<button class="btn download" onclick="downloadCard()">
📥 下載派車單圖片
</button>

</div>

<div id="dispatchCard" class="card landscape" style="display:none;">

<div class="card-header">

<div class="header-left">
JKGO｜機場接送派車單
</div>

<div class="header-right">
<img src="logo.png" class="logo">
</div>

</div>

<div class="dispatch-grid">

<div>

<div class="item">
<div class="item-title">接送日期</div>
<div class="item-box" id="showDate"></div>
</div>

<div class="item">
<div class="item-title">接送類型</div>
<div class="item-box" id="showType"></div>
</div>

<div class="item">
<div class="item-title">貴賓姓名</div>
<div class="item-box" id="showName"></div>
</div>

<div class="item">
<div class="item-title">乘車人數</div>
<div class="item-box" id="showPeople"></div>
</div>

<div class="item">
<div class="item-title">上車地點</div>
<div class="item-box" id="showPickup"></div>
</div>

<div class="item">
<div class="item-title">中途加點</div>
<div class="item-box" id="showAdd"></div>
</div>

</div>

<div>

<div class="item">
<div class="item-title">接送時間</div>
<div class="item-box" id="showTime"></div>
</div>

<div class="item">
<div class="item-title">航班代號</div>
<div class="item-box" id="showFlight"></div>
</div>

<div class="item">
<div class="item-title">連絡電話</div>
<div class="item-box" id="showPhone"></div>
</div>

<div class="item">
<div class="item-title">行李件數</div>
<div class="item-box" id="showBags"></div>
</div>

<div class="item">
<div class="item-title">下車地點</div>
<div class="item-box" id="showDropoff"></div>
</div>

<div class="item">
<div class="item-title">重要備註</div>
<div class="item-box" id="showRemark"></div>
</div>

</div>

</div>

<div class="sign-area">

<div class="sign-box">
<div class="sign-title">乘客簽名</div>
<div class="sign-line"></div>
</div>

</div>

<div class="footer">
JKGO 接送｜JK Airport Transfer System
</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

function generateCard(){

document.getElementById("dispatchCard").style.display = "block";

document.getElementById("showDate").innerText =
document.getElementById("date").value;

document.getElementById("showFlight").innerText =
document.getElementById("flight").value;

document.getElementById("showName").innerText =
document.getElementById("name").value;

document.getElementById("showPeople").innerText =
document.getElementById("people").value;

document.getElementById("showPickup").innerText =
document.getElementById("pickup").value;

document.getElementById("showAdd").innerText =
document.getElementById("add").value;

document.getElementById("showTime").innerText =
document.getElementById("time").value;

document.getElementById("showType").innerText =
document.getElementById("type").value;

document.getElementById("showPhone").innerText =
document.getElementById("phone").value;

document.getElementById("showBags").innerText =
document.getElementById("bags").value;

document.getElementById("showDropoff").innerText =
document.getElementById("dropoff").value;

document.getElementById("showRemark").innerText =
document.getElementById("remark").value;

}

function downloadCard(){

const card = document.getElementById("dispatchCard");

if(card.style.display === "none"){
    alert("請先產生派車單");
    return;
}

html2canvas(card,{
    scale:2,
    useCORS:true,

    // 強制橫向
    width:1200,
    windowWidth:1200,

    scrollX:0,
    scrollY:0

}).then(canvas=>{

    const image = canvas.toDataURL("image/png");

    // iPhone
    const ua = navigator.userAgent;

    if(/iPhone|iPad|iPod/i.test(ua)){

        const newTab = window.open();

        newTab.document.write(`
        <html>
        <head>
        <title>下載派車單</title>
        </head>

        <body style="margin:0;background:black;text-align:center;">

        <img src="${image}" 
        style="width:100%;max-width:1200px;">

        <p style="color:white;font-size:20px;">
        長按圖片即可儲存
        </p>

        </body>
        </html>
        `);

    }else{

        // Android / PC
        const link = document.createElement("a");

        link.href = image;

        link.download = "JKGO派車單.png";

        link.click();
    }

});

}

</script>

</body>
</html>
