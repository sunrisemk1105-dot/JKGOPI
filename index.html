<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>捷克接送派車單</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:32px;
    color:#111827;
    margin-bottom:10px;
}

.header p{
    color:#6b7280;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#111827;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.generate-btn{
    background:#111827;
    color:white;
}

.generate-btn:hover{
    background:black;
}

.download-btn{
    background:#2563eb;
    color:white;
}

.download-btn:hover{
    background:#1d4ed8;
}

.card{
    margin-top:30px;
    border:2px solid #111827;
    border-radius:15px;
    padding:25px;
    background:white;
}

.card-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    margin-bottom:20px;
    color:#6b7280;
}

.row{
    margin-bottom:15px;
    font-size:18px;
    line-height:1.8;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#9ca3af;
    font-size:14px;
}

hr{
    margin:20px 0;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✈️ 捷克接送派車單</h1>
        <p>機場接送系統版</p>
    </div>

    <div class="input-group">
        <label>乘客姓名</label>
        <input type="text" id="name" placeholder="請輸入乘客姓名">
    </div>

    <div class="input-group">
        <label>日期</label>
        <input type="date" id="date">
    </div>

    <div class="input-group">
        <label>時間</label>
        <input type="time" id="time">
    </div>

    <div class="input-group">
        <label>接送地址</label>
        <input type="text" id="address" placeholder="請輸入接送地址">
    </div>

    <div class="input-group">
        <label>航班資訊</label>
        <input type="text" id="flight" placeholder="例如：CI100">
    </div>

    <button class="generate-btn" onclick="generateCard()">
        🚗 產生派車單
    </button>

    <button class="download-btn" onclick="downloadImage()">
        📥 下載圖片
    </button>

    <div id="dispatchCard" class="card" style="display:none;">

        <div class="card-title">
            🚖 捷克接送派車單
        </div>

        <div class="sub">
            JKGO Airport Transfer
        </div>

        <hr>

        <div class="row">
            <b>乘客姓名：</b>
            <span id="showName"></span>
        </div>

        <div class="row">
            <b>日期：</b>
            <span id="showDate"></span>
        </div>

        <div class="row">
            <b>時間：</b>
            <span id="showTime"></span>
        </div>

        <div class="row">
            <b>接送地址：</b>
            <span id="showAddress"></span>
        </div>

        <div class="row">
            <b>航班資訊：</b>
            <span id="showFlight"></span>
        </div>

        <hr>

        <div class="footer">
            JKGO派車助手｜機場接送專用
        </div>

    </div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

function generateCard(){

    document.getElementById("showName").innerText =
        document.getElementById("name").value;

    document.getElementById("showDate").innerText =
        document.getElementById("date").value;

    document.getElementById("showTime").innerText =
        document.getElementById("time").value;

    document.getElementById("showAddress").innerText =
        document.getElementById("address").value;

    document.getElementById("showFlight").innerText =
        document.getElementById("flight").value;

    document.getElementById("dispatchCard").style.display = "block";
}

function downloadImage(){

    const card = document.getElementById("dispatchCard");

    html2canvas(card).then(canvas => {

        const link = document.createElement("a");

        link.download = "捷克接送派車單.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
